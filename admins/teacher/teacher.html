<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Лицей 554 — Панель преподавателя | Рекомендации по профилю</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./teacher.css">
</head>

<body>
    <nav>
        <div class="logoOfProduct">
            <img class="logoOfSchool" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23667eea'/%3E%3Ctext x='50' y='72' font-size='60' text-anchor='middle' fill='white'%3E🎓%3C/text%3E%3C/svg%3E"
                alt="лого">
            <div class="discription">
                <p>Система распределения по профилю</p>
                <div>
                    <p>Уровень допуска:</p>
                    <p id="levelCheck">Преподаватель</p>
                </div>
            </div>
        </div>
    </nav>
    <main>
        <div class="filter-panel">
            <div class="filter-group">
                <label>📌 Профиль обучения</label>
                <select id="profileSelect">
                    <option value="physmath">🔬 Физико-математический</option>
                    <option value="chembio">🧪 Химико-биологический</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📅 Учебный год</label>
                <select id="yearSelect">
                    <option value="">Загрузка годов...</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🏫 Класс</label>
                <select id="classSelect" disabled>
                    <option value="">Сначала выберите год</option>
                </select>
            </div>
        </div>

        <div class="stats-mini" id="statsInfo">👩‍🎓 Студенты: —</div>
        <div id="studentsContainer" class="students-grid">
            <div class="empty-state">✨ Выберите учебный год и класс, чтобы увидеть список учеников</div>
        </div>
    </main>
    <script type="module" src="./teacher.js">
    </script>
</body>

</html>
